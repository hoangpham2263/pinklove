services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-app}-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: ${COMPOSE_PROJECT_NAME:-app}-pgadmin
    image: dpage/pgadmin4:9
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-4040}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pinklove@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  web:
    container_name: ${COMPOSE_PROJECT_NAME:-app}-next
    build:
      context: ./web
      dockerfile: ../docker/web/Dockerfile.dev
    command: >
      sh -c "LOCK_HASH_FILE=node_modules/.package-lock.hash;
      CURRENT_HASH=$$(sha256sum package-lock.json | awk '{print $$1}');
      SAVED_HASH=$$(cat $$LOCK_HASH_FILE 2>/dev/null || true);
      if [ ! -d node_modules/next ] || [ \"$$CURRENT_HASH\" != \"$$SAVED_HASH\" ]; then
      npm ci &&
      mkdir -p node_modules &&
      echo $$CURRENT_HASH > $$LOCK_HASH_FILE;
      fi &&
      rm -rf .next &&
      npm run dev -- --hostname 0.0.0.0 --port 3000 --webpack"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3030}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  web-node-modules:
